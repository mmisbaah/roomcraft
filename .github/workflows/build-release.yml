name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prove the packaged app can actually boot and find its entry HTML,
      # so a broken build fails here instead of shipping a broken download.
      - name: Self-test packaged app
        shell: cmd
        run: |
          echo Listing app.asar contents:
          npx asar list "dist-electron\win-unpacked\resources\app.asar"
          echo.
          echo Running packaged binary with --selftest:
          "dist-electron\win-unpacked\RoomCraft.exe" --selftest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-Windows
          path: dist-electron/*.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoomCraft-Windows
          path: dist-electron

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist-electron/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}