name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Type checking runs before the build so a type error fails the release
      # instead of shipping. check-types-deps.mjs guards against a partial
      # @types/three install, which otherwise turns every `three` import into
      # noise and hides the real errors.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm run test:placement
          npm run test:walls
          npm run test:rooms
          npm run test:presets
          npm run test:grab

      - name: Build web app
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prove the packaged app can actually boot and find its entry HTML,
      # so a broken build fails here instead of shipping a broken download.
      - name: Self-test packaged app
        shell: cmd
        run: |
          echo Top-level entries inside app.asar:
          npx asar list "dist-electron\win-unpacked\resources\app.asar" > asar-list.txt
          type asar-list.txt | findstr /v /c:"node_modules"
          echo.
          echo Running packaged binary self-test:
          set RC_SELFTEST_OUT=%CD%\selftest.txt
          "dist-electron\win-unpacked\RoomCraft.exe" --selftest
          type selftest.txt
          findstr /b /c:"SELFTEST OK" selftest.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-Windows
          path: dist-electron/*.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoomCraft-Windows
          path: dist-electron

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist-electron/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}